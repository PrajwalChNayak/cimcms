[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    adafruit/RTClib
    adafruit/Adafruit NeoPixel
    ; Wi-Fi, WebServer, DNSServer and Preferences are included with ESP32 Arduino framework