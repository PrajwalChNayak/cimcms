# CIMCMS broker configuration (server). Mosquitto 2.x.

# ---- Listener --------------------------------------------------------------------------
# Plain MQTT. Kept for the Humidifier and existing clients.
listener 1883
allow_anonymous false

# TLS listener (later, when a domain and certificate exist; also uncomment 8883 in
# docker-compose.yml and mount the certificate folder). Passwords on 1883 are not encrypted.
# listener 8883
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem

# ---- Storage and logs --------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- Existing users (unchanged) ----------------------------------------------------------
# Your existing password file. It must be the SAME file name you have in ./config today
# (check with: ls config/). Do not recreate it: it holds mqttuser's password.
password_file /mosquitto/config/passwd

# Needed once the plugin below is active: without an acl_file, password-file users lose
# their subscribe rights (tested). The acl file keeps their access exactly as today.
acl_file /mosquitto/config/acl

# ---- Automatic device accounts (Dynamic Security plugin) ---------------------------------
# The CIMCMS API creates one account per device here (MQTT_PROVISIONING=dynsec).
# Users it does not know (mqttuser, ...) fall back to password_file / acl_file above.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
