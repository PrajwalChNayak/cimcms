# CIMCMS production stack (plan T4.2). Run from infra/prod with an env file, e.g.
#   cp .env.example .env   (git-ignored; set DOMAIN, CIMCMS_TAG, MAIN_ROUTE)
#   docker compose up -d
# Secrets live OUTSIDE the repo in ${CIMCMS_SECRETS_DIR} (default /opt/cimcms/secrets, mode 600):
#   api.env, postgres.env, broker.env. See docs/runbooks/deploy.md and docs/runbooks/broker.md.
# Two databases in the one postgres container: the app database (POSTGRES_DB, default cimcms;
# DATABASE_URL) and the broker database cimcms_broker (BROKER_DATABASE_URL; tables MqttAccount,
# MqttRetained), created by postgres-init/create-broker-db.sql on a NEW volume only (existing
# volume: create it by hand, see docs/runbooks/deploy.md). The api container applies the app
# migrations and the broker container the broker migrations (prisma migrate deploy) at start.
# D-3: exactly ONE api instance. Never add replicas or pm2 cluster mode.
name: cimcms

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: cimcms-web:${CIMCMS_TAG:?set CIMCMS_TAG, e.g. 2025.01.01-1}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. cims.example.org}
      MAIN_ROUTE: ${MAIN_ROUTE:-api/v1}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|MAIN_ROUTE)$$"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    depends_on:
      - api
    logging: *default-logging

  api:
    image: cimcms-api:${CIMCMS_TAG:?set CIMCMS_TAG, e.g. 2025.01.01-1}
    restart: unless-stopped
    env_file:
      - ${CIMCMS_SECRETS_DIR:-/opt/cimcms/secrets}/api.env
    expose:
      - "3814"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3814/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  # Own MQTT broker (apps/broker). Logins: table MqttAccount, retained messages: MqttRetained, in
  # its own database (BROKER_DATABASE_URL). Its entrypoint applies the broker migrations before
  # it starts. Runbook: docs/runbooks/broker.md.
  # The api also writes MqttAccount (device logins), so api.env has the same BROKER_DATABASE_URL.
  broker:
    image: cimcms-broker:${CIMCMS_TAG:?set CIMCMS_TAG, e.g. 2025.01.01-1}
    restart: unless-stopped
    env_file:
      # BROKER_DATABASE_URL (postgres:5432/cimcms_broker), same value as in api.env
      - ${CIMCMS_SECRETS_DIR:-/opt/cimcms/secrets}/broker.env
    environment:
      BROKER_PORT: "1883"
      BROKER_TLS_PORT: "8883"
      # Certificate for the MQTT host name (MQTT_DOMAIN, default DOMAIN). The key must be
      # readable by uid 1000 (node) inside the container; see docs/runbooks/broker.md (TLS).
      # Without readable cert + key the broker exits; remove these two lines to run 1883 only.
      BROKER_TLS_CERT: /etc/letsencrypt/live/${MQTT_DOMAIN:-${DOMAIN}}/fullchain.pem
      BROKER_TLS_KEY: /etc/letsencrypt/live/${MQTT_DOMAIN:-${DOMAIN}}/privkey.pem
      BROKER_HEALTH_PORT: "8081"
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ${CIMCMS_SECRETS_DIR:-/opt/cimcms/secrets}/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the broker database cimcms_broker on first start (empty volume only).
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # No published ports: reachable only as postgres:5432 on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  # minio: intentionally omitted (plan O default: existing upload features unused in this deployment).

volumes:
  postgres-data:
