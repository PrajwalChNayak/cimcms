# Nginx config template for the cimcms-web image (T4.2).
# The nginx image runs envsubst on /etc/nginx/templates/*.template at start and only
# replaces ${DOMAIN} and ${MAIN_ROUTE} (see NGINX_ENVSUBST_FILTER in docker-compose.yml);
# nginx's own $variables are left alone.

server_tokens off;

server {
  listen 80;
  server_name ${DOMAIN};

  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # CSP checked against the built SPA (Vite output, ECharts canvas, no external fonts/scripts):
  # nothing had to be loosened beyond the plan baseline. 'unsafe-inline' for styles is needed by
  # ECharts/React inline style attributes.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://${DOMAIN}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  client_max_body_size 1m;

  root /usr/share/nginx/html;

  # No add_header inside the locations below: it would drop the security headers set above.
  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass http://api:3814/${MAIN_ROUTE}/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://api:3814;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }
}
