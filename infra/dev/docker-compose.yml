name: cimcms-dev

# Superseded for MQTT: development now runs the own broker (npm run dev:broker, apps/broker);
# see infra/dev/mosquitto/README.md. This Mosquitto service is kept for comparison/rollback only.
#
# Local development only. Ports are bound to 127.0.0.1 so nothing is reachable from the network.
# The Postgres password below is a local dev default, not a secret; override it with
# CIMCMS_DEV_PG_PASSWORD if you want. Never reuse it anywhere else.
#
# Dev DATABASE_URL: postgresql://cimcms:cimcms_dev_only@localhost:5433/cimcms?schema=public

services:

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd
      - mosquitto-dev-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "pidof mosquitto >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mosquitto-dev-data:
