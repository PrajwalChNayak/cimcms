listener 1883
allow_anonymous false
persistence true
persistence_location /mosquitto/data/

# Dynamic Security plugin: device accounts are created by the API when a device is added
# in the web app (MQTT_PROVISIONING=dynsec). Its state lives in the data volume.
# Users in password_file / acl_file (cimcms-backend, LED-01, ...) keep working next to it:
# the plugin defers clients it does not know to the files below.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
