version: '3.8'

services:
  app:
    build: .
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mongodb://aquasolveiot:Qwer234Qwer234+@89.116.122.228:9122/aqua_solve_iot?replicaSet=rs0&retryWrites=true&w=majority
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped
