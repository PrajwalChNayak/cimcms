name: E2E (manual)

# Manual trigger only: runs the Playwright acceptance tests (plan T3.8). The test setup starts the
# own MQTT broker (apps/broker) and the API itself against a throwaway PostgreSQL service and
# creates the broker logins (MqttAccount) with random passwords in apps/web/e2e/.env.e2e
# (job-local, never committed). No Mosquitto is needed.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database container, not a secret (same value as the e2e default).
          POSTGRES_USER: cimcms
          POSTGRES_PASSWORD: cimcms_dev_only
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cimcms -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:contracts
      - run: npm run gp -w apps/api

      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # e2e/.env.e2e (user + broker passwords) is generated with random values when missing.
      - run: npx playwright test
        working-directory: apps/web
        env:
          E2E_PG_HOST: localhost
          E2E_PG_PORT: "5433"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
